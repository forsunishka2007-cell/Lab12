<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Мій особистий блог - Реєстрація</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background-color: #3498db;
      color: white;
      padding: 10px 40px;
      border-bottom: 4px solid #e74c3c;
    }
    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo h1 { margin: 0; font-size: 1.6rem; }
    .logo p { margin: 0; font-size: 0.9rem; font-weight: bold; }
    .nav-links a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-weight: bold;
    }
    .nav-links a:hover { text-decoration: underline; }

    footer {
      background-color: #2c3e50;
      color: #bdc3c7;
      text-align: center;
      padding: 15px 20px;
      font-size: 0.85rem;
      margin-top: auto;
    }

    .main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      background-color: #ffffff;
    }
    .register-card {
      width: 100%;
      max-width: 400px;
      border: 1px solid #bdc3c7;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .card-title {
      background-color: #3498db;
      color: white;
      text-align: center;
      padding: 12px;
      margin: 0;
      font-size: 1.2rem;
    }
    .form-body {
      padding: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.85rem;
      color: #333;
      font-weight: bold;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      outline: none;
    }
    .form-group input:focus {
      border-color: #3498db;
    }
    .btn-container {
      text-align: right;
      margin-top: 20px;
    }
    .btn-submit {
      background-color: #f3f3f3;
      color: #333;
      border: 1px solid #a6a6a6;
      padding: 6px 16px;
      cursor: pointer;
      font-size: 0.9rem;
      border-radius: 2px;
    }
    .btn-submit:hover {
      background-color: #e7e7e7;
      border-color: #8e8e8e;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="logo">
        <h1>Мій особистий блог</h1>
        <p>Артем</p> </div>
      <div class="nav-links">
        <a href="#">Вхід</a>
        <a href="index.html">Реєстрація</a> </div>
    </div>
  </header>

  <div class="main-content">
    <div class="register-card">
      <h2 class="card-title">Реєстрація користувача</h2>
      <form class="form-body" action="#" method="POST">
        
        <div class="form-group">
          <label>Прізвище</label>
          <input type="text" name="lastname" required>
        </div>

        <div class="form-group">
          <label>Ім'я</label>
          <input type="text" name="firstname" required>
        </div>

        <div class="form-group">
          <label>Логін</label>
          <input type="text" name="login" required>
        </div>

        <div class="form-group">
          <label>Навчальна група</label>
          <select name="group">
            <option value="101">101-ТК</option>
            <option value="102">102-ТК</option>
          </select>
        </div>

        <div class="form-group">
          <label>Пароль</label>
          <input type="password" name="password" required>
        </div>

        <div class="form-group">
          <label>Підтвердження паролю</label>
          <input type="password" name="password_confirm" required>
        </div>

        <div class="btn-container">
          <button type="submit" class="btn-submit">Зареєструватись</button>
        </div>

      </form>
    </div>
  </div>

  <footer>
    © Всі права захищені.<br>
    Розробник: студент навчальної групи Артем </footer>

</body>
</html>
